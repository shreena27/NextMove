<title>NextMove Casefile</title>
<!-- ============================================================
DIRECTION CONTRACT — v2 visual world (2026-09-05), replaces the
restrained teal/Sora world after explicit user feedback that the
Teak reference "did not come through" and the design read boring.

Pinned reference: Teak (mobbin.com/sites/teak-879ecee4...), studied
from its actual captured sections this time, not a token paraphrase:
- warm cream paper with a faint drafting-grid texture
- deep espresso-plum ink, chunky rounded serif display voice
- ONE loud accent: butter yellow, used exactly two ways —
  highlighter swipes on the key word, and the primary pill CTA
- small colored square markers as nav/category devices
- data chips as filled pastel pills; white rounded cards, soft borders
- playful floating gem/diamond confetti around emotional peaks

NextMove translation: Fraunces (display) + Work Sans (body) +
IBM Plex Mono (stamps/citations/official numbers). Butter yellow
#F5D848 owns highlight + primary action. Per-service square markers:
Passport green, Voter pink, Income blue. The four status
classifications stay semantic and calm (WAIT green / FOLLOW UP
amber / ESCALATE clay / UNCLASSIFIED warm gray) as filled chips —
distinct in shape+casing from the butter accent so they never
collide. Escalation stays visually calm: no warning triangles, ever.

Motion thesis — focal moment: the Diagnosis reveal. The status
stamp slams in like a rubber stamp on a paper casefile (scale+rotate
settle), the highlighter draws under the key word, the dependency
block slides in. Supporting: staggered answer rows, springy selected
checks, arrow-nudge on pill hovers, sequential case-trail pops.
Everything honors prefers-reduced-motion.

All playbook logic, routing, copy, and product guardrails are
unchanged from v1 — this contract governs the visual layer only.

Balance note (explicit user steer, 2026-09-05): "not another
government website, and not a game either." Playful-premium, not
gamified — no mascots, badges, points, streaks, or confetti storms;
gems stay small and appear at exactly two moments.

ADHD/cognitive-accessibility pass (2026-09-05, adhd-design-expert
skill, user-approved "apply what's logical"): (1) a per-rule
`howLong` field renders as a "How long?" row on Next Move — sourced
dates stated as facts (Delhi's 30 Sep claims-filing deadline, 4 Nov
Final Roll, the Citizen's Charter PV exclusion), verified ABSENCE
stated everywhere else ("no official timeline exists — that's why
there's no countdown"); omitted on UNCLASSIFIED fallbacks.

Freshness model (2026-09-05, user-approved): detect automatically →
degrade automatically → adopt only after human verification. Sources
live committed under sources/ with manifest.json (rule → verbatim
quote) and check_freshness.py (hash-compare against the live URLs).
When a source changes, affected guidance DEGRADES — the paused
"re-verifying" screen and banners below — rather than continuing to
assert claims the project can no longer back, and never auto-adopts
the newer document (two official Delhi SIR calendars contradicted
each other on the day this was designed; recency is not truth). The
footer carries a labeled preview toggle so reviewers can see the
degraded state. Trust panels show the last human-verification date.
(2) Honest brevity promises only where structurally true: Passport
guardrail lede ("two quick questions"), "Last question" chips on
Passport Q2 / Voter Q2, "Just one question" on SIR Q1 — this does NOT
reverse the locked numeric-progress removal, which was about
branch-dependent counts. (3) S-4's 12-document prose converted to a
scannable list (content verbatim). Deliberately NOT applied: streaks,
XP, celebrations (collide with the no-game steer and product truth);
persistence/tracking (V1 scope boundary, highest-value ADHD feature
for the tracking slice).

"Prepare this for me" (2026-09-05, user decision: draft + GUIDED
submission IN; auto-submission stays OUT per the locked Non-Goal and
the trust caption). New per-service prepare screens: an editable
drafted follow-up (per-rule template with [bracket] placeholders in
this static prototype; AI-composed from verified case facts in the
real build) with a Copy control, plus a tick-off submission checklist
("N of M done") whose final step is always performed by the user on
the official channel. CTA appears only on FOLLOW_UP/ESCALATE rules
with PREP content; WAIT/UNCLASSIFIED end with a quiet Back to Home
(the old "future slice" boundary screen is gone). Steps never invent
unverified portal menu paths, fees, or deadlines.

Deferred auth layer (2026-09-05, user decision): diagnosis stays
fully anonymous (Product Principle #4 — no login gates core value);
auth exists at exactly one moment — "Save this case for later" on
Next Move / Prepare. Method order per user: Google primary, phone
OTP secondary, email fallback. Saving snapshots answers + diagnosis
+ ticked prepare steps into a "Your casefile" card on Home
(Continue restores everything; Remove and Sign out are confirmed
actions). Prototype simulates auth (instant Google, any 6-digit
code) and persists via localStorage in the viewer's browser only —
all guarded, page renders fine with empty/blocked storage. Restart
never clears sign-in or the saved case.

Detector defenses (deliberate, do not "fix"):
- overused-font (Work Sans): incumbent body face from the approved
  v1 system; the identity lives in Fraunces + IBM Plex Mono.
- codex-grid-background: the drafting-grid ground is the pinned Teak
  reference's own hero texture and the product's casefile-paper
  metaphor — a chosen material, not a generated-UI default.
============================================================ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FAF7EF;
  --card:#FFFFFF;
  --ink:#3D241C;
  --ink-soft:#6E6152;
  /* darkened from #7A7264 (4.44:1 on paper — an AA fail on the small
     text this token carries) to 4.77:1, kept a step lighter than
     ink-soft so the two secondary grays stay distinguishable */
  --ink-faint:#756D5F;
  --line:#EAE4D6;
  --line-strong:#DCD4C2;
  --butter:#F5D848;
  --butter-deep:#E8C51F;
  /* butter-soft repositioned off the amber axis (2026-09-05 polish):
     the old #FBF0C4 was visually identical to --follow-bg #FBEFC9,
     putting the FOLLOW UP status tint on decorative surfaces — the
     exact defect the reserved-status-colors rule forbids. #FDF8E3 is
     measurably whiter/lighter; production adds a ΔE floor test between
     every non-status token and all four status fills. */
  --butter-soft:#FDF8E3;
  --sq-green:#2FA866;
  --sq-pink:#F0679E;
  --sq-blue:#5FA8E8;
  --wait:#1F6B3D;
  --wait-bg:#D9F2DF;
  --follow:#8A5A0F;
  --follow-bg:#FBEFC9;
  --escalate:#9E2F1F;
  --escalate-bg:#FBDFD6;
  --unclassified:#6B6257;
  --unclassified-bg:#EFEAE0;
  --shadow-float:0 10px 30px rgba(61,36,28,0.08), 0 2px 6px rgba(61,36,28,0.05);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*{box-sizing:border-box;}
::selection{background:var(--butter); color:var(--ink);}
html{scrollbar-color:var(--line-strong) var(--paper);}
body{
  margin:0; background-color:var(--paper); color:var(--ink);
  /* the drafting-grid paper — the casefile's own material */
  background-image:
    linear-gradient(to right, rgba(61,36,28,0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(61,36,28,0.035) 1px, transparent 1px);
  background-size:34px 34px;
}
.app{
  font-family:'Work Sans',system-ui,sans-serif;
  min-height:100vh;
  color:var(--ink);
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* ---------- shell: full-width site chrome, not an app card ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 40px; border-bottom:1px solid var(--line);
  background:var(--paper);
  position:sticky; top:0; z-index:10;
}
.brand{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:19px;
  letter-spacing:-0.01em; color:var(--ink); text-decoration:none; cursor:pointer;
  background:none; border:none; padding:0;
  display:inline-flex; align-items:center; gap:8px;
}
.brand .brand-mark{display:inline-flex; transition:transform 300ms var(--ease);}
.brand:hover .brand-mark{transform:rotate(90deg);}
.topctrls{display:flex; align-items:center; gap:14px;}
.ctrl-link{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.04em;
  color:var(--ink-soft); background:var(--card); cursor:pointer;
  border:1px solid var(--line-strong); border-radius:999px; padding:7px 14px;
  transition:border-color 150ms ease, color 150ms ease, transform 150ms var(--ease);
}
.ctrl-link:hover{color:var(--ink); border-color:var(--ink); transform:translateY(-1px);}
/* Focus rings are ink, not butter: butter-deep measured 1.58:1 against
   the paper ground — a nearly invisible focus indicator (WCAG needs 3:1).
   Ink clears 10:1 on every surface including the butter CTA itself. */
.ctrl-link:focus-visible, a:focus-visible, button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible{
  outline:2.5px solid var(--ink); outline-offset:3px; border-radius:4px;
}
.restart-confirm{
  display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft);
}
.restart-confirm button{font-family:'Work Sans',sans-serif;}
.restart-confirm .yes{color:var(--escalate); font-weight:600; background:none; border:none; cursor:pointer;}
.restart-confirm .no{color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline;}

.stage{
  max-width:1460px; margin:0 auto; padding:56px 48px 90px; position:relative;
}
@media (max-width:600px){
  .topbar{padding:14px 18px;}
  .stage{padding:24px 18px 70px;}
}

/* ---------- desktop split: context left, action right ----------
   The website layout. Question screens read like an editorial spread —
   the big Fraunces question holds the left, the answer list works on
   the right — instead of a mobile card floating in whitespace. */
.split{display:block;}
.narrow{max-width:640px;}
@media (min-width:960px){
  .split{display:grid; grid-template-columns:minmax(0,6fr) minmax(0,7fr); gap:110px; align-items:start;}
  .split-r .answers{margin-top:6px;}
  .split-r .list-lead{margin-top:2px;}
}

/* screen transition */
.screen{animation:enter 260ms var(--ease);}
@keyframes enter{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---------- confetti gems — Teak's floating shapes, at the two
     emotional peaks only (Home hero, Diagnosis reveal). Decorative,
     aria-hidden, never in the reading column. ---------- */
.gems{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
.split-l{position:relative;}
.split-l > *:not(.gems), .split-r > *, .stage > *:not(.gems):not(.split){position:relative; z-index:1;}
.gem{position:absolute; animation:drift 7s ease-in-out infinite alternate;}
.gem:nth-child(2){animation-duration:9s; animation-delay:-2s;}
.gem:nth-child(3){animation-duration:8s; animation-delay:-4s;}
.gem:nth-child(4){animation-duration:10s; animation-delay:-1s;}
.gem:nth-child(5){animation-duration:11s; animation-delay:-3s;}
@keyframes drift{
  from{transform:translateY(0) rotate(0deg);}
  to{transform:translateY(-14px) rotate(14deg);}
}
@media (max-width:600px){.gems{display:none;}}

/* ---------- footer disclaimer ---------- */
.protofooter{
  max-width:1180px; margin:40px auto 0; padding:16px 40px 40px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--ink-faint); line-height:1.6;
}

/* ---------- crumbs: Teak's marker-square device carrying the
     service/phase context (replaces the old floating mono eyebrows —
     same information, now a designed component) ---------- */
.crumbs{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 18px;}
.crumb{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em;
  color:var(--ink); background:var(--card); border:1px solid var(--line-strong);
  border-radius:6px; padding:5px 10px; display:inline-flex; align-items:center; gap:7px;
}
.crumb.soft{color:var(--ink-soft); background:transparent; border-style:dashed;}
.crumb-sq{width:8px; height:8px; border-radius:2px; flex:0 0 auto;}
.sq-passport{background:var(--sq-green);}
.sq-voter{background:var(--sq-pink);}
.sq-income{background:var(--sq-blue);}
.sq-butter{background:var(--butter);}

/* ---------- typography ---------- */
h1.headline{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:44px; line-height:1.06;
  letter-spacing:-0.015em; margin:0 0 16px; color:var(--ink);
  text-wrap:balance;
}
h2.headline{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:33px; line-height:1.12;
  letter-spacing:-0.012em; margin:0 0 14px; color:var(--ink); text-wrap:balance;
}
.hero-h1{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:40px; line-height:1.08;
  letter-spacing:-0.013em; margin:0 0 16px; color:var(--ink); text-wrap:balance;
}
/* The Diagnosis reveal — the signature screenshot moment. */
.reveal-headline{
  font-family:'Fraunces',Georgia,serif; font-weight:800; font-size:40px; line-height:1.05;
  letter-spacing:-0.015em; margin:2px 0 22px; color:var(--ink); text-wrap:balance;
}
@media (max-width:600px){
  h1.headline{font-size:33px;} h2.headline{font-size:26px;} .hero-h1{font-size:30px;}
  .reveal-headline{font-size:30px;}
}
/* Desktop website scale — must sit AFTER the base typography rules so it
   wins the cascade (the split-layout block above is before them). */
@media (min-width:960px){
  .hero-h1{font-size:58px;}
  h1.headline{font-size:48px;}
  h2.headline{font-size:38px;}
  .reveal-headline{font-size:48px;}
  .lede{font-size:17px; max-width:56ch;}
  .hero-promise{font-size:18px;}
  .nm-lead{font-size:38px;}
  .svc{padding:26px 8px;}
  .svc-title{font-size:22px;}
  .arow{padding:21px 8px;}
  .arow-label{font-size:16.5px;}
}
/* highlighter swipe — butter, drawn in like a marker stroke */
.mark{position:relative; white-space:nowrap;}
.mark::after{
  content:""; position:absolute; left:-3px; right:-3px; bottom:1px; height:0.42em;
  background:var(--butter); z-index:-1; border-radius:3px;
  transform:skewX(-6deg); transform-origin:left;
  animation:draw 480ms var(--ease) 240ms both;
}
@keyframes draw{from{scale:0 1;} to{scale:1 1;}}
.lede{font-size:15.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 26px; max-width:52ch;}
.small{font-size:13px; color:var(--ink-soft); line-height:1.6;}

/* ---------- home ---------- */
.hero-promise{font-size:16px; color:var(--ink-soft); margin:6px 0 30px; max-width:46ch; line-height:1.6;}
.list-lead{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:20px; margin:0 0 4px;
}
.services{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); margin-top:12px;}
.svc{
  display:flex; align-items:center; gap:16px; padding:20px 4px; border-bottom:1px solid var(--line);
  background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;
  cursor:pointer; font-family:inherit; color:inherit;
  transition:background 160ms ease;
}
.svc:hover:not(.disabled){background:var(--butter-soft);}
.svc:hover:not(.disabled) .svc-icon{transform:rotate(-6deg) scale(1.06);}
.svc:hover:not(.disabled) .svc-chevron{transform:translateX(4px); color:var(--ink);}
.svc.disabled{cursor:default;}
.svc.disabled .svc-icon, .svc.disabled .svc-title, .svc.disabled .svc-sub{opacity:0.5;}
.svc-icon{
  flex:0 0 auto; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
  border-radius:11px; transition:transform 250ms var(--ease);
}
.svc-icon.ic-passport{background:#DFF3E6; color:#1F6B3D;}
.svc-icon.ic-voter{background:#FBE3EE; color:#B03A6E;}
.svc-icon.ic-income{background:#E1EEFA; color:#2E6CA8;}
.svc-body{flex:1;}
.svc-title{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:20px; margin-bottom:2px;}
.svc-sub{font-size:13px; color:var(--ink-soft);}
.svc-tag{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--ink-soft); border:1px solid var(--line-strong); background:var(--card); border-radius:999px; padding:4px 9px; flex:0 0 auto;
}
.svc-chevron{color:var(--ink-faint); flex:0 0 auto; transition:transform 200ms var(--ease), color 150ms ease;}

/* ---------- answer rows: same divided-list anatomy as Home ---------- */
.answers{margin-top:20px; border-top:1px solid var(--line);}
.arow{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  padding:18px 4px; border:none; border-bottom:1px solid var(--line); background:none;
  cursor:pointer; font-family:'Work Sans',sans-serif; color:var(--ink); border-radius:0;
  transition:background 160ms ease;
  animation:rowin 320ms var(--ease) both;
}
.arow:nth-child(1){animation-delay:40ms;} .arow:nth-child(2){animation-delay:90ms;}
.arow:nth-child(3){animation-delay:140ms;} .arow:nth-child(4){animation-delay:190ms;}
.arow:nth-child(5){animation-delay:240ms;} .arow:nth-child(6){animation-delay:290ms;}
@keyframes rowin{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.arow:hover{background:var(--butter-soft);}
.arow:hover .arow-chevron{transform:translateX(4px); color:var(--ink);}
.arow.selected{background:var(--butter-soft);}
.arow-check{
  flex:0 0 auto; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; background:var(--card);
  transition:transform 250ms var(--ease), background 150ms ease, border-color 150ms ease;
}
.arow.selected .arow-check{border-color:var(--ink); background:var(--ink); transform:scale(1.12);}
.arow-check svg{opacity:0; transition:opacity 120ms ease;}
.arow.selected .arow-check svg{opacity:1;}
.arow-body{flex:1;}
.arow-label{font-size:15.5px; line-height:1.4; font-weight:500;}
.arow-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
.arow-chevron{flex:0 0 auto; color:var(--ink-faint); transition:transform 200ms var(--ease), color 150ms ease;}

/* ---------- buttons: butter pill primary (Teak's own CTA), espresso secondary ---------- */
.btn{
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:15px; cursor:pointer;
  border-radius:999px; padding:14px 26px; border:1.5px solid transparent;
  transition:transform 180ms var(--ease), box-shadow 180ms ease, background 150ms ease, border-color 150ms ease;
  display:inline-flex; align-items:center; gap:8px;
}
.btn .btn-arrow{display:inline-flex; transition:transform 200ms var(--ease);}
.btn:hover .btn-arrow{transform:translateX(4px);}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:var(--butter); color:var(--ink); border-color:var(--butter);
  width:100%; justify-content:center; box-shadow:0 2px 0 rgba(61,36,28,0.14);
}
.btn-primary:hover{background:var(--butter-deep); border-color:var(--butter-deep); transform:translateY(-2px); box-shadow:0 5px 14px rgba(61,36,28,0.16);}
.btn-secondary{background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong);}
.btn-secondary:hover{border-color:var(--ink); transform:translateY(-1px);}
.btn-block{width:100%; justify-content:center; margin-top:22px;}

/* ---------- status stamp: the rubber-stamp moment ---------- */
.stamp-row{margin:4px 0 18px;}
.stamp{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.08em; font-weight:600;
  padding:8px 14px 8px 12px; border-radius:8px; text-transform:uppercase;
  display:inline-flex; align-items:center; gap:7px;
  animation:stampin 450ms var(--ease) 200ms both;
}
@keyframes stampin{
  0%{opacity:0; transform:scale(1.5) rotate(-5deg);}
  60%{opacity:1; transform:scale(0.96) rotate(1deg);}
  100%{opacity:1; transform:scale(1) rotate(-1deg);}
}
.stamp-icon{display:inline-flex; flex:0 0 auto;}
.stamp.wait{color:var(--wait); background:var(--wait-bg);}
.stamp.follow{color:var(--follow); background:var(--follow-bg);}
.stamp.escalate{color:var(--escalate); background:var(--escalate-bg);}
.stamp.unclassified{color:var(--unclassified); background:var(--unclassified-bg); border:1.5px dashed var(--unclassified); animation-name:stampin-flat;}
@keyframes stampin-flat{from{opacity:0; transform:scale(1.2);} to{opacity:1; transform:scale(1);}}

/* "Waiting on" — its own emphasized block, so the dependency reads
   at a glance (the product's core differentiator). */
.dep-block{
  background:var(--butter-soft); border:1px solid var(--butter);
  border-radius:14px;
  padding:16px 20px; margin:22px 0 24px;
  animation:enter 300ms var(--ease) 340ms both;
}
.dep-k{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 5px;
}
.dep-v{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:20px; color:var(--ink); line-height:1.25;}
@media (min-width:760px){
  .dep-v{font-size:26px;}
}

.explain{font-size:15.5px; line-height:1.65; color:var(--ink); margin:0 0 22px; max-width:58ch;}

/* ---------- case trail ----------
   Only where a real, verified process sequence exists (Passport's
   4-step flow); never invented for Voter/SIR. Dots pop in sequence. */
.case-trail{display:flex; align-items:flex-start; gap:0; margin:8px 0 30px;}
.ct-step{flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; animation:rowin 300ms var(--ease) both;}
.ct-step:nth-child(1){animation-delay:380ms;} .ct-step:nth-child(2){animation-delay:460ms;}
.ct-step:nth-child(3){animation-delay:540ms;} .ct-step:nth-child(4){animation-delay:620ms;}
.ct-step:not(:last-child)::after{
  content:""; position:absolute; top:11px; left:calc(50% + 16px); right:calc(-50% + 16px); height:1.5px; background:var(--line-strong);
}
.ct-step.done:not(:last-child)::after{background:var(--ink);}
.ct-dot{width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--card); z-index:1; display:flex; align-items:center; justify-content:center;}
.ct-step.done .ct-dot{background:var(--ink); border-color:var(--ink);}
.ct-step.current .ct-dot{
  width:26px; height:26px; border:2px solid var(--ink); background:var(--butter);
  box-shadow:0 0 0 4px var(--butter-soft);
}
.ct-step.current .ct-dot::after{content:""; width:9px; height:9px; border-radius:50%; background:var(--ink);}
.ct-label{font-size:11px; margin-top:10px; color:var(--ink-faint); line-height:1.3; max-width:80px;}
.ct-step.current .ct-label{color:var(--ink); font-weight:600;}
.ct-step.done .ct-label{color:var(--ink-soft);}
.ct-here{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink); background:var(--butter); border-radius:4px; padding:2px 6px;
  font-weight:600; margin-top:5px;
}
@media (max-width:600px){.ct-label{font-size:10px; max-width:64px;}}

/* ---------- next move: lead statement + divided fields ---------- */
.nm-lead{
  font-family:'Fraunces',Georgia,serif; font-weight:800; font-size:30px; line-height:1.15;
  letter-spacing:-0.01em; color:var(--ink); margin:0 0 10px; text-wrap:balance;
}
.nm-lead-detail{font-size:15px; color:var(--ink-soft); line-height:1.6; margin:0 0 30px; max-width:54ch;}
@media (max-width:600px){.nm-lead{font-size:24px;}}
.nm-fields{border-top:1px solid var(--line-strong); margin-bottom:6px;}
.nm-field{border-top:1px solid var(--line); padding:20px 0;}
.nm-field:first-child{border-top:none; padding-top:0;}
.nm-k{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 8px;
}
.nm-v{font-size:15px; line-height:1.6; color:var(--ink);}
.nm-v a{color:var(--ink); text-decoration-color:var(--butter-deep); text-decoration-thickness:2px; text-underline-offset:3px; transition:background 150ms ease;}
.nm-v a:hover{background:var(--butter-soft);}
.nm-v .phone{font-family:'IBM Plex Mono',monospace; font-size:13.5px;}
.handoff-note{font-size:12.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}
.need-list{margin:6px 0 0; padding:0 0 0 20px;}
.need-list li{margin:0 0 7px; line-height:1.5;}

/* ---------- trust disclosure ---------- */
.trust-toggle{
  background:none; border:none; color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-size:13.5px;
  cursor:pointer; display:flex; align-items:center; gap:6px; padding:4px 0; margin-top:18px;
  border-bottom:1px solid transparent; transition:color 150ms ease, border-color 150ms ease;
}
.trust-toggle:hover{color:var(--ink); border-color:var(--line-strong);}
.trust-panel{
  margin-top:14px; padding:20px 22px; background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow-float);
  animation:enter 240ms var(--ease);
}
.trust-row{margin-bottom:14px;}
.trust-row:last-child{margin-bottom:0;}
.trust-row .nm-k{margin-bottom:6px;}
.trust-row .nm-v{font-size:13.5px;}
.source-quote{
  font-style:italic; color:var(--ink-soft); font-size:13px; border-left:2px solid var(--butter);
  padding-left:12px; margin-top:6px;
}

/* ---------- unclassified / recovery banners ---------- */
.banner{border:1px solid var(--line-strong); border-radius:14px; padding:18px 20px; background:var(--card); margin-bottom:20px;}

/* ---------- text input ---------- */
.field-input{
  width:100%; border:1.5px solid var(--line-strong); border-radius:14px; padding:14px 16px; font-family:'Work Sans',sans-serif;
  font-size:14.5px; color:var(--ink); background:var(--card); resize:vertical; min-height:88px;
  caret-color:var(--ink);
  transition:border-color 150ms ease;
}
.field-input::placeholder{color:var(--ink-faint);}
.field-input:hover{border-color:var(--ink-faint);}
.field-input:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px; border-color:var(--ink);}

/* ---------- inline explainer ---------- */
.inline-explain{
  margin-top:14px; padding:16px 18px; border:1.5px dashed var(--line-strong); border-radius:14px; font-size:13.5px;
  color:var(--ink-soft); line-height:1.6; background:var(--card); animation:enter 220ms var(--ease);
}
.inline-explain-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
.inline-explain-actions button{font-size:13px; padding:9px 16px;}

/* ---------- prepare: draft + guided submission ----------
   The user reviews, edits, copies, and submits the draft themselves —
   NextMove never files anything. Steps are a tick-off checklist
   (satisfying, visible progress; not persisted — it's a prototype). */
.prep-card{
  background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow-float); padding:20px 22px; margin-bottom:26px;
}
.prep-draft{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:14px 16px;
  font-family:'Work Sans',sans-serif; font-size:14px; line-height:1.65; color:var(--ink);
  background:var(--paper); resize:vertical; min-height:230px; caret-color:var(--ink);
}
.prep-draft:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px;}
.prep-card-foot{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:12px; flex-wrap:wrap;}
.prep-hint{font-size:12.5px; color:var(--ink-faint); line-height:1.5; flex:1; min-width:200px;}
.copy-btn{
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; font-weight:600;
  background:var(--card); color:var(--ink); border:1.5px solid var(--line-strong); border-radius:999px;
  padding:9px 18px; cursor:pointer; transition:border-color 150ms ease, background 150ms ease;
}
.copy-btn:hover{border-color:var(--ink);}
.copy-btn.copied{background:var(--wait-bg); color:var(--wait); border-color:var(--wait);}
.copy-btn.copied-warn{background:var(--follow-bg); color:var(--follow); border-color:var(--follow);}
.psteps-done{
  font-size:14px; color:var(--wait); font-weight:600; line-height:1.55;
  background:var(--wait-bg); border-radius:12px; padding:13px 18px; margin:16px 0 0;
  animation:enter 260ms var(--ease);
}
.saved-next{font-size:13.5px; color:var(--ink); margin-top:5px; font-weight:500;}
.saved-next::before{content:"→ "; color:var(--ink-faint);}
.saved-steps{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
  color:var(--ink-soft); margin-left:10px;
}
.saved-meta{display:flex; align-items:center;}
.psteps{border-top:1px solid var(--line-strong);}
.psteps-count{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 10px;
}
.pstep{
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--line);
  transition:background 160ms ease;
}
.pstep:hover{background:var(--butter-soft);}
.pstep-tick{
  flex:1; display:flex; align-items:flex-start; gap:14px; text-align:left;
  padding:15px 4px; border:none; background:none; cursor:pointer;
  font-family:'Work Sans',sans-serif; color:var(--ink);
}
.pstep-box{
  flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong);
  background:var(--card); display:flex; align-items:center; justify-content:center; margin-top:1px;
  transition:background 150ms ease, border-color 150ms ease;
}
.pstep.done .pstep-box{background:var(--butter); border-color:var(--ink);}
.pstep-box svg{opacity:0;}
.pstep.done .pstep-box svg{opacity:1;}
.pstep-text{flex:1; font-size:14.5px; line-height:1.55;}
.pstep.done .pstep-text{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-strong);}
.pstep-link{
  flex:0 0 auto; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em;
  color:var(--ink); text-decoration:none; border:1px solid var(--line-strong); border-radius:999px;
  padding:6px 12px; margin-right:4px; background:var(--card);
  transition:border-color 150ms ease;
}
.pstep-link:hover{border-color:var(--ink);}

/* the official channel, one tap away, opening in a new tab so the
   draft stays exactly where the user left it */
.channel-card{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
  padding:16px 20px; margin-bottom:22px;
}
.channel-body{flex:1; min-width:220px;}
.channel-k{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 4px;
}
.channel-v{font-size:14.5px; font-weight:600; line-height:1.45;}
.channel-phone{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
.channel-open{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:13.5px;
  color:var(--ink); text-decoration:none; background:var(--butter);
  border:1.5px solid var(--butter); border-radius:999px; padding:10px 18px;
  box-shadow:0 2px 0 rgba(61,36,28,0.14);
  transition:background 150ms ease, transform 180ms var(--ease), box-shadow 180ms ease;
}
.channel-open:hover{background:var(--butter-deep); border-color:var(--butter-deep); transform:translateY(-1px);}
.prep-trust{font-size:13px; color:var(--ink-soft); line-height:1.6; margin-top:18px; max-width:48ch;}
/* the in-person visit card: verified carry items + general practical
   tips, explicitly labeled apart so general advice never wears the
   verified-source costume */
.visit-card{
  background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
  padding:20px 22px; margin:22px 0 0;
}
.visit-title{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:17px; margin:0 0 14px;}
.visit-cols{display:block;}
@media (min-width:760px){ .visit-cols{display:grid; grid-template-columns:1fr 1fr; gap:26px;} }
.visit-k{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 8px;
}
.visit-list{margin:0; padding:0 0 0 18px;}
.visit-list li{font-size:13.5px; line-height:1.55; margin:0 0 7px; color:var(--ink);}
.visit-note{
  font-size:11.5px; color:var(--ink-faint); line-height:1.55; margin-top:12px;
  border-top:1px dashed var(--line); padding-top:10px;
}

/* ---------- save / auth: value first, account only to keep the case ----
   Diagnosis never requires sign-in (Product Principle #4). Auth exists
   at exactly one moment: "keep this case for later." ---------- */
.btn-ghost{
  background:none; border:none; cursor:pointer; width:100%; justify-content:center;
  display:inline-flex; align-items:center; gap:8px; margin-top:14px; padding:10px;
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft);
  border-radius:999px; transition:color 150ms ease, background 150ms ease;
}
.btn-ghost:hover{color:var(--ink); background:var(--butter-soft);}
.saved-note{
  display:flex; align-items:center; justify-content:center; gap:8px; margin-top:14px;
  font-size:13.5px; color:var(--wait); font-weight:600;
}
.acct-chip{
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:13px;
  color:var(--ink); background:var(--card); border:1px solid var(--line-strong);
  border-radius:999px; padding:5px 14px 5px 5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:8px;
  transition:border-color 150ms ease, color 150ms ease;
}
.acct-chip:hover{border-color:var(--ink);}
.acct-chip.noname{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.03em; color:var(--ink-soft);}
.acct-chip.noname:hover{color:var(--ink);}
.acct-av{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%;
  background:var(--butter); color:var(--ink); border:1px solid var(--ink);
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:12.5px;
}
/* The small account popover: border-only card (small popovers read as
   cards, not overlays — they don't earn shadow elevation). Case actions
   deliberately live on Home's cards, never here. */
.acct-wrap{position:relative; display:inline-flex;}
.acct-scrim{position:fixed; inset:0; z-index:19; background:transparent;}
.acct-pop{
  position:absolute; top:calc(100% + 10px); right:0; z-index:20;
  min-width:250px; background:var(--card); border:1px solid var(--line-strong);
  border-radius:14px; padding:6px; animation:enter 180ms var(--ease);
  text-align:left;
}
.acct-pop-head{padding:12px 14px 10px; border-bottom:1px solid var(--line);}
.acct-pop-name{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:16.5px; color:var(--ink);}
.acct-pop-sub{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:3px;}
.acct-pop-row{
  display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
  font-family:'Work Sans',sans-serif; font-size:13.5px; color:var(--ink);
  padding:11px 14px; border-radius:9px; transition:background 150ms ease;
}
.acct-pop-row:hover{background:var(--butter-soft);}
.acct-pop-row .row-sub{display:block; font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.acct-pop-confirm{padding:11px 14px; font-size:13px; color:var(--ink-soft); line-height:1.5;}
.acct-pop-confirm .yes{color:var(--escalate); font-weight:600; background:none; border:none; cursor:pointer; padding:6px 8px 0 0;}
.acct-pop-confirm .no{color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline; padding:6px 0 0;}
.auth-field{margin:0 0 16px;}
.auth-label{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 8px;
}
.auth-input{
  width:100%; border:1.5px solid var(--line-strong); border-radius:14px; padding:14px 16px;
  font-family:'Work Sans',sans-serif; font-size:16px; color:var(--ink); background:var(--card);
  caret-color:var(--ink); transition:border-color 150ms ease;
}
.auth-input:hover{border-color:var(--ink-faint);}
.auth-input:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px; border-color:var(--ink);}
.otp-input{
  font-family:'IBM Plex Mono',monospace; font-size:26px; letter-spacing:0.45em; text-align:center;
  padding:16px 10px 16px 22px;
}
.auth-err{font-size:13px; color:var(--escalate); margin:8px 0 0; font-weight:500;}
.auth-divider{
  display:flex; align-items:center; gap:12px; margin:18px 0;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink-faint);
}
.auth-divider::before, .auth-divider::after{content:""; flex:1; height:1px; background:var(--line);}
.btn-google{
  width:100%; display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font-family:'Work Sans',sans-serif; font-weight:600; font-size:14.5px; color:var(--ink);
  background:var(--card); border:1.5px solid var(--line-strong); border-radius:999px;
  padding:13px 22px; cursor:pointer; transition:border-color 150ms ease, transform 180ms var(--ease);
}
.btn-google:hover{border-color:var(--ink); transform:translateY(-1px);}
.auth-switch{
  background:none; border:none; cursor:pointer; padding:4px 0; margin-top:4px;
  font-family:'Work Sans',sans-serif; font-size:13.5px; color:var(--ink-soft);
  text-decoration:underline; text-underline-offset:3px;
}
.auth-switch:hover{color:var(--ink);}
.auth-note{font-size:12.5px; color:var(--ink-faint); line-height:1.55; margin-top:16px;}
.demo-hint{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);
  border:1px dashed var(--line-strong); border-radius:8px; padding:8px 12px; margin-top:14px;
  display:inline-block;
}
/* the saved casefile on Home — a compact, whole-card tap target that
   opens the casefile screen; detail (log, check-ins, Remove) lives there */
.saved-card{
  display:flex; align-items:center; gap:16px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow-float); padding:16px 20px; margin:10px 0 30px;
  cursor:pointer; font-family:'Work Sans',sans-serif; color:var(--ink);
  transition:border-color 150ms ease, transform 180ms var(--ease);
}
.saved-card:hover{border-color:var(--ink); transform:translateY(-1px);}
.saved-card:hover .arow-chevron{transform:translateX(4px); color:var(--ink);}
.saved-body{flex:1; min-width:220px; display:block;}
.saved-kicker{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--ink-faint); margin:0 0 5px; display:flex; align-items:center; gap:7px;
}
.saved-title{display:block; font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:18px; line-height:1.25;}
.saved-next{display:block;}
.saved-meta{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
.saved-actions{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.case-meta-line{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.04em;
  color:var(--ink-soft); margin:0 0 14px;
}
.case-links{border-top:1px solid var(--line); margin-top:20px;}
.case-link{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:13px 4px; border:none; border-bottom:1px solid var(--line); background:none;
  cursor:pointer; font-family:'Work Sans',sans-serif; font-size:14px; font-weight:500; color:var(--ink);
  transition:background 150ms ease;
}
.case-link:hover{background:var(--butter-soft);}
.case-remove{
  background:none; border:none; cursor:pointer; font-family:'Work Sans',sans-serif;
  font-size:12.5px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:3px;
  padding:4px; margin-top:18px;
}
.case-remove:hover{color:var(--escalate);}
/* casefile screen: the case's identity (left) and the add-an-update
   module (right). Butter border marks the primary action area — the one
   place the accent is allowed to frame a container. */
.case-h1{
  font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:30px; line-height:1.12;
  letter-spacing:-0.012em; margin:0 0 12px; color:var(--ink); text-wrap:balance;
}
@media (min-width:960px){ .case-h1{font-size:36px;} }
.case-progress{margin:20px 0 4px;}
.cp-head{display:flex; align-items:center; justify-content:space-between; margin:0 0 7px;}
.cp-count{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
/* fill = butter with an ink edge (the trail dot's own pattern) — raw
   butter against the line track measured 1.12:1, an invisible bar */
.cp-bar{height:11px; border-radius:999px; background:var(--line); border:1px solid var(--line-strong); overflow:hidden;}
.cp-fill{display:block; height:100%; background:var(--butter); border-right:1.5px solid var(--ink); border-radius:999px 3px 3px 999px; transition:width 300ms var(--ease); box-shadow:inset 0 -1px 0 rgba(61,36,28,0.25);}
.update-mod{
  background:var(--card); border:1.5px solid var(--butter); border-radius:16px;
  padding:20px 22px;
}
.um-head{display:flex; align-items:center; gap:12px; margin:0 0 10px;}
.um-kicker{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 2px;
}
.um-title{font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:21px; margin:0; line-height:1.2;}
.saved-continue{
  display:inline-flex; align-items:center; gap:7px; font-family:'Work Sans',sans-serif;
  font-weight:600; font-size:13.5px; color:var(--ink); background:var(--butter);
  border:1.5px solid var(--butter); border-radius:999px; padding:10px 18px; cursor:pointer;
  box-shadow:0 2px 0 rgba(61,36,28,0.14);
  transition:background 150ms ease, transform 180ms var(--ease);
}
.saved-continue:hover{background:var(--butter-deep); border-color:var(--butter-deep); transform:translateY(-1px);}
.saved-remove{
  background:none; border:none; cursor:pointer; font-family:'Work Sans',sans-serif;
  font-size:12.5px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:3px; padding:4px;
}
.saved-remove:hover{color:var(--escalate);}
.stamp.mini{font-size:10px; padding:4px 8px 4px 7px; border-radius:5px; animation:none;}
.saved-card.closed{opacity:0.75; box-shadow:none;}

/* ---------- check-in loop ---------- */
.ci-panel{
  background:var(--card); border:1.5px solid var(--butter); border-radius:14px;
  padding:16px 20px; animation:enter 220ms var(--ease);
}
.ci-panel.reassure{border-color:var(--line-strong); border-style:dashed;}
.remind-row{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px;
  border-top:1px dashed var(--line); padding-top:14px;
}
.remind-input{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);
  border:1.5px solid var(--line-strong); border-radius:10px; padding:8px 12px; background:var(--card);
}
.journey{margin-top:16px; border-top:1px solid var(--line); padding-top:10px;}
.log-e{font-size:12.5px; line-height:1.55; margin:0 0 6px; color:var(--ink-soft);}
.log-e.log-mile{color:var(--ink); font-weight:500;}
.log-d{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-right:4px;}

}

/* ================= DESCRIBE IT — AI-INTERPRETED ANSWERS =================
   Spec: docs/superpowers/specs/2026-09-05-describe-it-ai-interpretation-design.md
   The interpreter (production: Gemini free tier behind this same contract;
   here: a labeled deterministic simulator) may ONLY:
   - map text onto the closed option sets it is handed (enum gate, in code)
   - justify every mapping with a verbatim span of the user's text
     (span gate, in code — replaces trusting a confidence float)
   - extract facts whose value is a verbatim substring (fact gate, in code)
   It never sees playbook rules; the user confirms before anything is set;
   the verified playbook then runs byte-identically. The pasted-status
   matcher stays exact-match-only (different risk profile: no confirm
   step there) — the describe box is NOT offered on that screen. */

// order. reachableIf gates a question on earlier (known or mapped)

    {id:'voterEntry', label:'What is this about?', opts:()=>({applied:"I applied for something and I'm waiting to hear back", sir:'This is about SIR'})},

// Simulator phrase tables. First matching rule per question wins; rules
// are ordered so more specific readings beat generic ones. The match
// itself is the span — verbatim by construction.
// DELIBERATE FLAW (kept on purpose, per spec §5): the first q2 rule
// reads any "called me/was called" as the USER having called — an
// agent/patient confusion exactly like a real model makes. It exists so
// reviewers experience catching a wrong reading on the confirm screen,
// which is this feature's actual safeguard.
const SIM_RULES = {
  q1:[
    {re:/adverse|negative report|objection|looks negative/i, v:'adverse'},
    {re:/report (has been |was |is )?(received|submitted|done)|verification.{0,30}(done|complete|completed|finished|over)/i, v:'verified_no_progress'},

    {re:/(no|not|never|haven'?t|havent|nothing).{0,40}(police|verification)|police.{0,40}(hasn'?t|hasnt|not|never|no).{0,25}(come|came|started|happened|contacted|visited)/i, v:'no_contact'},
  ],
  q2:[
    {re:/grievance|cpgrams|formal complaint/i, v:'formal_grievance'},
    {re:/\b(called|phoned|rang|visited|emailed|wrote to)\b/i, v:'informal'},
    {re:/(haven'?t|havent|didn'?t|didnt|not yet).{0,30}(follow|contact|call|complain|do anything)/i, v:'no_followup'},
  ],
  voterEntry:[
    {re:/\bsir\b|special intensive|enumeration form|draft roll/i, v:'sir'},
    {re:/applied|correction|new (voter|registration)|replacement|epic|voter card|form 6|form 8/i, v:'applied'},

  ],
  voterAppealedRaw:[

  ],
  sirQ1:[

    {re:/name.{0,40}(isn'?t|isnt|not|missing)|not (on|in) the.{0,15}roll/i, v:'roll_absent'},

// Per-service reference-number shapes (prototype approximations, stated
// as such in the spec). A number matching no known shape becomes an
// honest "a number you mentioned" chip and fills NOTHING.
const REF_SHAPES = {
  passport:[
    {re:/\b[A-Z]{2}\d{13}\b/i, refType:'passport_file_no', label:'File Number', fills:'[File Number / ARN]'},
    {re:/\b\d{12}\b/, refType:'arn', label:'ARN', fills:'[File Number / ARN]'},
    {re:/\b[A-Z]{5,8}\/\d{4}\/\d{4,8}\b/i, refType:'grievance_no', label:'Grievance number', fills:'[CPGRAMS grievance number]'},
  ],
  voter:[
    {re:/\b[A-Z]{3}\d{7}\b/i, refType:'epic', label:'EPIC number', fills:null},
    {re:/\b\d{9,13}\b/, refType:'voter_ref', label:'Reference number', fills:'[reference number]'},
  ],
  sir:[
    {re:/\b[A-Z]{3}\d{7}\b/i, refType:'epic', label:'EPIC number', fills:null},
  ],
};
const UNKNOWN_REF = /\b(?=[A-Z0-9]*\d)[A-Z0-9]{8,18}\b/g;

function extractFacts(engine, text){
  const facts=[]; const taken=[];
  for(const shape of (REF_SHAPES[engine]||[])){
    const m = text.match(shape.re);
    if(m && !taken.some(t=>t.includes(m[0]))){
      facts.push({kind:'reference_number', refType:shape.refType, label:shape.label, value:m[0], fills:shape.fills});
      taken.push(m[0]);
    }
  }
  // unknown-shaped numbers: shown honestly, never fill a bracket
  const unk = text.match(UNKNOWN_REF)||[];
  for(const u of unk){
    if(!taken.some(t=>t.includes(u)||u.includes(t))){
      facts.push({kind:'reference_number', refType:'unknown', label:'A number you mentioned', value:u, fills:null});
      taken.push(u); break; // one is enough
    }
  }
  // dates: only an APPLIED date auto-fills (its role is unambiguous);
  // any other date is a chip that fills nothing. Relative dates never match.
  const applied = text.match(/(applied|submitted).{0,20}?((\d{1,2}\s)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s?\d{2,4})/i);
  if(applied){ facts.push({kind:'date', refType:'date_applied', label:'Applied', value:applied[2], fills:'[date you applied]'}); }
  const otherDate = text.match(/\b(\d{1,2}\s)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s?\d{0,4}\b/i);
  if(otherDate && (!applied || otherDate[0]!==applied[2])){
    facts.push({kind:'date', refType:'date_other', label:'Date you mentioned', value:otherDate[0].trim(), fills:null});
  }
  return facts;
}

// The contract gates, applied IN CODE regardless of what any model (or
// this simulator) returns: enum gate, span gate, verbatim-fact gate,
// then branch pruning over the chain.
function gateInterpretation(ctx, text, raw){
  const norm = s=>s.replace(/\s+/g,' ').trim().toLowerCase();
  const hay = norm(text);
  const known = {...S.answers};
  const mapped = {};
  const mappings=[]; const discarded=[];
  for(const q of ctx.chain){
    const reach = !q.reachableIf || q.reachableIf({...known, ...mapped});
    const m = raw.mappings.find(x=>x.questionId===q.id);
    if(!m) continue;
    const opts = q.opts();
    if(!reach){ discarded.push({q, reason:'unreachable'}); continue; }          // branch gate
    if(!Object.prototype.hasOwnProperty.call(opts, m.value)) continue;           // enum gate
    if(!m.span || !hay.includes(norm(m.span))) continue;                         // span gate
    mapped[q.id]=m.value;
    mappings.push({questionId:q.id, value:m.value, span:m.span, q});
  }
  const facts = (raw.facts||[]).filter(f=>f.value && text.replace(/\s+/g,' ').includes(f.value.replace(/\s+/g,' '))); // verbatim-fact gate
  return {mappings, discarded, facts, unplaceable: mappings.length===0};
}

function simulateInterpretation(ctx, text){
  const rawMappings=[]; const mapped={};
  const known={...S.answers};
  for(const q of ctx.chain){
    if(known[q.id]) continue;
    if(q.reachableIf && !q.reachableIf({...known, ...mapped})) continue;
    const rules = SIM_RULES[q.id]||[];
    for(const r of rules){
      const m = text.match(r.re);
      if(m){ rawMappings.push({questionId:q.id, value:r.v, span:m[0]}); mapped[q.id]=r.v; break; }
    }
  }
  return gateInterpretation(ctx, text, {mappings:rawMappings, facts:extractFacts(ctx.engine, text)});
}

// Browser storage: casefiles and sign-in live only in this viewer's
// browser (prototype stand-in for server-side accounts). Every access
// is guarded — storage can be empty or throw entirely.
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
S.user = store.get('nm_user');
// Backfill for sessions that signed in before the name feature existed:
// a Google session always carries a profile name in production (OAuth
// supplies it every load), so the sim mirrors that here. Phone/email
// legacy sessions can't have a name invented — the popover offers an
// "Add your name" row instead.
if(S.user && S.user.method==='google' && !S.user.name){
  S.user.name='Ananya'; store.set('nm_user', S.user);
}
// Multi-case store, with one-time migration of the old single-case slot.
// Cases are account-scoped (grill A8 semantics): they load only when a
// user is present — signed out, stored cases stay in storage but never
// render, and signing back in adopts them again.
S.savedCases = S.user ? (store.get('nm_cases') || []) : [];
(function migrate(){
  const old = store.get('nm_case');
  if(old && !S.savedCases.length){
    S.savedCases = [{...old, id:'c'+(old.savedAt||Date.now()), outcome:'still_open',
      returnScreen: old.returnScreen || (old.engineKey+'-nextmove'),
      log:[{t:old.savedAt||Date.now(), kind:'diagnosed', text:old.stateLabel||'Case saved'}]}];
    store.set('nm_cases', S.savedCases); store.del('nm_case');
  }
})();
function persistCases(){ store.set('nm_cases', S.savedCases); }
// The working case (grill chunk 3): tracking never requires an account.
// "Add an update" on an unsaved diagnosis creates an in-memory case that
// behaves exactly like a saved one — check-ins, journey log, undo — but
// lives only in this tab. Saving ADOPTS its log wholesale, which is what
// makes "save this case and keep this history" a true sentence.
function activeCase(){
  if(S.activeCaseId==='working') return S.workingCase;
  return S.savedCases.find(c=>c.id===S.activeCaseId) || null;
}
function beginWorkingCheckin(engineKey, serviceLabel, returnScreen){
  const saved = S.savedCases.find(c=>c.outcome==='still_open' && c.engineKey===engineKey
    && JSON.stringify(c.answers)===JSON.stringify(S.answers));
  if(saved){ openCheckin(saved.id); return; }
  if(!S.workingCase || S.workingCase.engineKey!==engineKey
      || JSON.stringify(S.workingCase.answers)!==JSON.stringify(S.answers)){

      id:'working', unsaved:true, outcome:'still_open', lastCheck:null, remindAt:null,

/* ---- source freshness: detect → degrade → human re-verify ----
   (user-approved model, 2026-09-05). In production, check_freshness.py's
   CHANGED verdict flips the affected service into degraded mode
   automatically; here a labeled footer preview toggle plays that role so
   reviewers can see the state. Degraded = NextMove pauses case-specific
   advice for the service (new cases get the re-verifying screen; saved
   cases keep their record but check-ins offer only the universal options)
   rather than assert guidance it can't currently back. It never
   auto-adopts the changed source — recency is not truth. */
const SOURCES_VERIFIED = '5 Sep 2026'; // last human verification of sources/manifest.json
const FRESHNESS = { demo:false, changedOn:'5 Sep 2026', services:['sir'] };
function degradedFor(k){ return FRESHNESS.demo && FRESHNESS.services.includes(k); }
function toggleFreshDemo(){ FRESHNESS.demo=!FRESHNESS.demo; render(); }
function freshBanner(engineKey){
  if(!degradedFor(engineKey)) return '';
  return `<div class="banner"><p class="small" style="margin:0;"><b>Being re-verified.</b> An official source behind this guidance changed on ${FRESHNESS.changedOn}. A human is re-checking the affected rules against it. Until that's done, NextMove pauses its case-specific advice here rather than show guidance it can't currently back. For anything urgent, use the official channel directly.</p></div>`;
}

function nav(screen, opts){
  if(opts && opts.replace){ /* no history push */ } else { S.history.push(S.screen); }
  S.screen = screen; S.trustOpen=false; S.restartConfirm=false; S.removeConfirm=false; S.authErr=null; S.acctOpen=false; render();
  const el=document.getElementById('app'); if(el) el.scrollIntoView({block:'start'});
}
// Arriving at Home via Back clears the working case (grill chunk 3):
// leaked answers used to pre-select a "new" flow and let a save merge
// one case over another. Home is a clean slate, always.
function back(){
  if(!S.history.length) return;
  const prev = S.history.pop();
  if(prev==='home'){ restart(); return; }
  S.screen=prev; S.trustOpen=false; S.authErr=null; render();
}

// survive (they're removed via Sign out / Remove, never as a side effect).
function restart(){ S.screen='home'; S.history=[]; S.answers={}; S.restartConfirm=false; S.recoveryText=''; S.recoveryResult=null; S.prepChecks={}; S.prepDraft=null; S.copied=false; S.pendingSave=null; S.otp=''; S.authErr=null; S.signOutConfirm=false; S.removeConfirm=null;
  S.describeOpen=false; S.describeText=''; S.describeErr=null; S.reading=false; S.interp=null; S.interpChangeOpen={}; S.caseFacts=[]; S.appliedText=null; S.factEditIdx=null; S.fillsReviewed=false;
  S.activeCaseId=null; S.workingCase=null; S.ciPending=null; S.ciStage=null; S.ciReassure=false; S.ciJustUpdated=false; S.phaseDrift=false; S.acctOpen=false; S.pendingName=''; render(); }

/* ---- save / auth flow (multi-case) ---- */
function beginSave(engineKey, serviceLabel, returnScreen){
  S.pendingSave = {engineKey, serviceLabel, returnScreen};
  S.otp=''; S.authErr=null;
  if(S.user){ completeSave(); nav('save-done'); } else { nav('save-case'); }
}
function caseSnapshot(engineKey, serviceLabel, returnScreen){
  const d = currentDiagnosis(engineKey);
  const prep = d.id ? PREP[d.id] : null;
  return {
    engineKey, serviceLabel, returnScreen,
    answers:{...S.answers}, prepChecks:{...S.prepChecks},
    savedAt:Date.now(), stateLabel:d.label, rec:d.rec,
    whatShort:d.whatShort||null,
    stepsTotal: prep ? prep.steps.length : 0,
    stepsDone: prep ? prep.steps.filter((_,i)=>S.prepChecks[i]).length : 0,
    caseFacts:(S.caseFacts||[]).slice(), appliedText:S.appliedText||null,
    interpProvenance:S.appliedText ? 'simulated (design prototype)' : null,
    sirPhaseId: engineKey==='sir' && S.answers.sirState && SIR_STATES[S.answers.sirState].supported ? SIR_STATES[S.answers.sirState].phase.id : null,
  };
}
// One active case per service, formalized (user decision, 2026-09-05):
// saving matches the open case for the SERVICE, updates it in place, and
// memorializes a changed diagnosis in the log. A working (unsaved) case
// for the service hands its whole journey log to the save.
function completeSave(){
  const p = S.pendingSave; if(!p) return;
  const snap = caseSnapshot(p.engineKey, p.serviceLabel, p.returnScreen);
  const working = (S.workingCase && S.workingCase.engineKey===p.engineKey) ? S.workingCase : null;
  const existing = S.savedCases.find(c=>c.outcome==='still_open' && c.engineKey===p.engineKey);
  if(existing){
    const prevLabel = existing.stateLabel;
    Object.assign(existing, snap);
    if(working) existing.log.push(...working.log.filter(e=>e.kind!=='diagnosed'));
    if(prevLabel!==snap.stateLabel) existing.log.push({t:Date.now(), kind:'diagnosed', text:snap.stateLabel});
    S.activeCaseId = existing.id;
  } else {
    const c = {...snap, id:'c'+Date.now(), outcome:'still_open',
      lastCheck: working ? working.lastCheck : null, remindAt: working ? working.remindAt : null,
      log: working ? working.log : [{t:Date.now(), kind:'diagnosed', text:snap.stateLabel}]};
    S.savedCases.unshift(c); S.activeCaseId = c.id;
  }
  S.workingCase=null;
  persistCases();
}
function caseIsSaved(engineKey){
  return S.savedCases.some(c=>c.outcome==='still_open' && c.engineKey===engineKey
    && JSON.stringify(c.answers)===JSON.stringify(S.answers));
}
// Check-in write path: EVENT semantics, not correction semantics.
// Facts always survive; prepare progress survives unless the diagnosis

function updateAns(patch){
  for(const [k,v] of Object.entries(patch)){
    if(v===null || v===undefined){ delete S.answers[k]; } else { S.answers[k]=v; }
  }
}
function authSubmitId(){
  const v = (S.authId||'').trim();
  if(S.authMethod==='phone'){
    const digits = v.replace(/[^0-9]/g,'');
    if(digits.length<10){ S.authErr='That doesn\'t look like a full mobile number yet.'; render(); return; }
    S.authId = digits.slice(-10);
  } else {
    if(!v.includes('@') || !v.includes('.')){ S.authErr='That doesn\'t look like a complete email address yet.'; render(); return; }
  }
  S.authErr=null; S.otp=''; nav('save-otp');
}
// Signing in adopts whatever cases the account already has in storage,
// BEFORE any save completes — so a save started while signed out can
// never clobber the stored set.
function adoptStoredCases(){ S.savedCases = store.get('nm_cases') || []; }
function authVerifyOtp(){
  const code=(S.otp||'').replace(/[^0-9]/g,'');
  if(code.length!==6){ S.authErr='The code is 6 digits.'; render(); return; }
  S.user = {method:S.authMethod, id:S.authId};
  store.set('nm_user', S.user);
  adoptStoredCases();
  // Phone/email carry no name — one optional, skippable ask before the
  // save completes (Google skips this: its account already has a name).
  S.pendingName=''; nav('save-name');
}
function saveNameFinish(withName){
  const n=(S.pendingName||'').trim();
  if(withName && n){ S.user.name=n; store.set('nm_user', S.user); }
  // Reached either mid-save (pendingSave set → finish the save) or from
  // the popover's "Add your name" row (no pending save → just go back).
  if(S.pendingSave){ completeSave(); nav('save-done'); }
  else { nav('home'); }
}
function authGoogle(){
  // Simulated in the prototype — the real build uses Google OAuth, and the
  // name comes from the Google profile (demo name stands in for it here).
  S.user = {method:'google', id:'you@gmail.com', name:'Ananya'};
  store.set('nm_user', S.user);

  completeSave(); nav('save-done');
}
function authResend(){ S.otpResent=true; render(); setTimeout(()=>{ S.otpResent=false; render(); }, 2000); }
function maskId(u){
  if(!u) return '';
  if(u.method==='phone') return '+91 •••••• ' + u.id.slice(-3);
  const [name, domain] = u.id.split('@');
  return name.charAt(0) + '•••@' + (domain||'');
}
// Sign-out clears the SESSION only (grill A8): cases stay on the account
// and come back at the next sign-in. Remove (per-case, on Home) is the
// deletion path — never this.
function signOut(){
  S.user=null; S.savedCases=[]; S.activeCaseId=null; S.signOutConfirm=false; S.acctOpen=false;
  store.del('nm_user');
  restart();
}
function loadCase(id){
  const c=S.savedCases.find(x=>x.id===id); if(!c) return null;
  S.activeCaseId=id;
  S.answers={...c.answers}; S.prepChecks={...c.prepChecks}; S.prepDraft=null;
  S.caseFacts=(c.caseFacts||[]).slice(); S.appliedText=c.appliedText||null; S.fillsReviewed=false;
  // SIR phase drift: a case saved in one phase, opened in another, gets
  // told so and is re-diagnosed against the current phase before any
  // check-in options are offered.
  S.phaseDrift = !!(c.sirPhaseId && S.answers.sirState && SIR_STATES[S.answers.sirState].supported
    && SIR_STATES[S.answers.sirState].phase.id !== c.sirPhaseId);
  return c;
}
function continueSaved(id){
  const c=loadCase(id); if(!c) return;
  // Older saved-case shapes can lack returnScreen; Next Move is always a
  // valid landing for an open case, so the button can never dead-end.
  nav(c.returnScreen || (c.engineKey+'-nextmove'));
}
function removeSaved(id){
  S.savedCases = S.savedCases.filter(c=>c.id!==id);
  if(S.activeCaseId===id) S.activeCaseId=null;
  S.removeConfirm=null; persistCases(); render();
}
function reopenCase(id){
  const c=S.savedCases.find(x=>x.id===id); if(!c) return;
  c.outcome='still_open'; c.log.push({t:Date.now(), kind:'reopened', text:'Case reopened: this came back'});
  persistCases(); loadCase(id); nav(c.engineKey+'-diagnosis');
}
// Any answer write means the case (and therefore the diagnosis and its
// prepare plan) may have changed — draft edits, ticked steps, and
// interpreted facts belong to the old diagnosis, so they reset HERE,
// and only here. Navigating away from a prepare screen and coming back
// never loses progress: progress dies with the case, not with the
// screen. (applyInterpretation re-assigns caseFacts AFTER its setAns
// calls, so facts survive the apply that created them.)
function setAns(k,v){ S.answers[k]=v; S.prepChecks={}; S.prepDraft=null; S.copied=false; S.caseFacts=[]; S.appliedText=null; S.fillsReviewed=false; }

// Every answerLabels map passed to trustDisclosure MUST be built with
// labelMap(questionId, {value: label, ...}) so its keys are the composite
// "questionId:value" form that matchedAnswers is looked up by below.
// (Fixed 2026-09-04: the Passport/Voter/SIR label objects were previously
// keyed by value alone — e.g. PASSPORT_Q1_LABELS['no_contact'] — while this
// function looked them up as 'q1:no_contact'. That mismatch meant "You told
// us" silently showed nothing for every real Passport/Voter/SIR-Q1 answer;
// only the one or two call sites that happened to already use a composite
// key, like the old 'voterAppealed:no', ever displayed correctly.)
function labelMap(questionId, labels){
  return Object.fromEntries(Object.entries(labels).map(([v,l])=>[questionId+':'+v, l]));
}
function trustDisclosure(d, answerLabels, extraToldUs){
  const answered = Object.entries(d.matchedAnswers||{})
    .filter(([k,v])=>answerLabels[k+':'+v])
    .map(([k,v])=>answerLabels[k+':'+v]);
  if(extraToldUs) answered.push(extraToldUs);
  return `
  <button class="trust-toggle" onclick="S.trustOpen=!S.trustOpen; render();">
    ${S.trustOpen ? '▾' : '▸'} Why am I seeing this?
  </button>
  ${S.trustOpen ? `<div class="trust-panel">
    <div class="trust-row"><div class="nm-k">You told us</div><div class="nm-v">${answered.join(' · ') || 'Not enough to safely place your case; see below.'}</div></div>
    ${S.appliedText ? `<div class="trust-row"><div class="nm-k">You wrote</div><div class="nm-v" style="font-style:italic;">"${S.appliedText}"</div>${S.caseFacts.length ? `<div class="small" style="margin-top:6px;">Details kept from it: ${S.caseFacts.map(f=>`${f.label} ${f.value}`).join(' · ')}</div>` : ''}</div>` : ''}
    <div class="trust-row"><div class="nm-k">What that means</div><div class="nm-v">${d.explanation}</div></div>
    <div class="trust-row"><div class="nm-k">Based on</div><div class="nm-v">${d.source.title}${d.source.quote?`<div class="source-quote">"${d.source.quote}"</div>`:''}${d.source.title.startsWith("NextMove's own") ? '' : `<div class="small" style="margin-top:5px; color:var(--ink-faint);">Checked against NextMove's archived copy of this source on ${SOURCES_VERIFIED}.</div>`}</div></div>
  </div>` : ''}`;
}

function runInterpretation(screenId){
  const text = (S.describeText||'').trim();
  if(!text){ S.describeErr='Write a line or two first. Even rough words are fine.'; render(); return; }
  const ctx = DESCRIBE_CTX[screenId];
  S.reading = true; S.describeErr=null; render();
  // Simulated async: the real build awaits a model call here and fails
  // closed to the unplaceable panel on timeout/quota/malformed output.
  setTimeout(()=>{
    const result = simulateInterpretation(ctx, text);
    S.interp = {ctxScreen:screenId, engine:ctx.engine, service:ctx.service, text, ...result};
    S.reading=false; S.interpChangeOpen={}; S.factEditIdx=null;
    nav('interp-confirm');
  }, 600);
}
function interpPick(qid, value){
  const m = S.interp.mappings.find(x=>x.questionId===qid);
  if(m){ m.value=value; m.changed=true; }
  // Re-derive reachability: a changed pick can void a later mapping.
  const known={...S.answers}; const mapped={};
  const kept=[];
  for(const mm of S.interp.mappings){
    const q = DESCRIBE_CTX[S.interp.ctxScreen].chain.find(c=>c.id===mm.questionId);
    const reach = !q.reachableIf || q.reachableIf({...known, ...mapped});
    if(reach){ mapped[mm.questionId]=mm.value; kept.push(mm); }
    else { S.interp.discarded.push({q, reason:'unreachable'}); }
  }
  S.interp.mappings = kept;
  S.interpChangeOpen[qid]=false;
  render();
}
function removeFact(i){ S.interp.facts.splice(i,1); render(); }

function checkinOptions(c){
  const d = currentDiagnosis(c.engineKey);
  const cfg = (d.id && CHECKIN[d.state]) ? CHECKIN[d.state] : (d.id ? CHECKIN[d.id] : null);
  const base = cfg ? cfg.opts.slice() : [];
  // options come from state × prepare-step completion: with untouched
  // steps, lead shame-free with "I haven't done this yet"
  const prep = d.id ? PREP[d.id] : null;
  const done = prep ? prep.steps.filter((_,i)=>S.prepChecks[i]).length : 0;
  const list = [];
  if(cfg && cfg.prepAware && prep && done===0 && !degradedFor(c.engineKey)){
    list.push({k:'notdone', label:"I haven't done this yet; take me back to the steps"});
  }
  // Under source re-verification, state-specific options pause with the
  // guidance they came from — only the universal three remain.
  if(!degradedFor(c.engineKey)) list.push(...base);
  list.push({k:'nothing', label:'Nothing yet'});
  list.push({k:'deliverable', label:DELIVERABLE_LABEL[c.engineKey]});
  list.push({k:'else', label:'Something else happened'});
  return {d, list};
}
// Every log write snapshots first, structurally — ciLog cannot run
// un-snapshotted, so every check-in (including nothing-yet, previously
// the one un-undoable kind) carries an Undo. Entry semantics are TYPED
// (flags like noChange), never recovered by parsing the prose.
function ciLog(kind, text, flags){
  const c=activeCase(); if(!c) return;
  ciSnapshotNow();
  c.log.push({t:Date.now(), kind, text, ...(flags||{})});
  c.lastCheck=Date.now();

}
function ciPersistState(){
  const c=activeCase(); if(!c) return;
  Object.assign(c, caseSnapshot(c.engineKey, c.serviceLabel, c.returnScreen));
  persistCases();
}
function openCheckin(id){

function ciChoose(i){
  const c=activeCase(); const {list}=checkinOptions(c);
  const opt=list[i]; S.ciPending=opt; S.ciReassure=false;
  if(opt.k==='nothing'){
    // first-class: log, restate the verified answer, never imply lateness
    const prev=c.log[c.log.length-1];
    S.ciConsecutive = prev && prev.kind==='checked';
    ciLog('checked','Checked in — no change reported', {noChange:true});
    S.ciReassure=true; S.ciPending=null; render(); return;
  }
  if(opt.k==='notdone'){ nav(c.engineKey+'-prepare'); return; }
  if(opt.k==='else'){
    ciLog('checked','Reported something outside the listed options; re-diagnosing');
    const first={passport:'passport-q1', voter:'voter-entry', sir:'sir-q1'}[c.engineKey];
    nav(first); return;
  }
  if(opt.k==='valence'){ S.ciStage='valence'; render(); return; }
  if(opt.k==='closureq' || opt.k==='resolved-rung' || opt.k==='deliverable'){ S.ciStage='closureq'; render(); return; }

function ciSnapshotNow(){

}
function ciApplyPatch(opt, reportLabel){
  const c=activeCase();

  ciLog('reported', reportLabel);
  updateAns(opt.patch||{});
  const after = currentDiagnosis(c.engineKey);
  if(before.id!==after.id || before.state!==after.state){
    S.prepChecks={};                     // the plan changed; the log kept the work
    ciLog('diagnosed', after.label);
  }
  ciPersistState();
  S.ciJustUpdated=true; S.ciStage=null; S.ciPending=null;
  nav(c.engineKey+'-diagnosis');
}
function ciConfirm(){

function ciValence(accepted){

  if(opt.rejectDeadend){
    ciLog('reported', opt.label+' — rejected');
    S.ciStage=null; S.ciPending=null; nav('dead-end'); return;
  }

function ciClosureAnswer(gotIt){

    c.log.push({t:Date.now(), kind:'closed', text:'Case closed — deliverable received'});

    S.ciStage=null; S.ciPending=null; nav('case-closed'); return;
  }

  // patch maps to a "moving again" state); a favourable decision maps to
  // the accepted-pending state. The universal "I got it!" option has no
  // patch: reporting maybe-then-not changes nothing, honestly.
  const pp = (S.ciAccepted && opt.acceptPendingPatch) || opt.pendingPatch;

function renderInterpConfirm(){
  const it = S.interp;

      `)}
    </div>`;
  }
  const cards = it.mappings.map((m)=>{
    const q = ctx.chain.find(c=>c.id===m.questionId);

      return `<div class="read-card">

    // pre-selected — no lone-label anchoring.
    return `<div class="read-card">

      <div class="read-opts">

      </div>
    </div>`;
  }).join('');
  return `${topbar(true,false)}
  <div class="stage screen">
    ${splitCols(`
    ${crumbs([it.service,'How we read it'], sq)}
    <h1 class="headline">Here's how we read it.</h1>

    `)}
  </div>`;
}

// A very small, explicit, exact-match set of example status phrases —
// deliberately not loose keyword matching. Fixed 2026-09-04: the previous
// version matched on the bare substring "verif", which meant a status like
// "verification completed" and one like "verification incomplete" both hit
// the same branch — a real misclassification risk. Anything that isn't an
// exact match against one of these three examples resolves to UNCLASSIFIED
// (q1 stays 'not_sure') rather than guessing. "If we don't know, we don't
// guess" — matching more phrases "intelligently" is not a goal here.
const PASTE_MATCH_EXAMPLES = [
  { text:'police verification report has been received', q1:'verified_no_progress' },
  { text:'passport has been dispatched', outOfScope:true },
  { text:'application has adverse report', q1:'adverse' },
];
function normalizePasted(t){ return (t||'').trim().toLowerCase().replace(/\s+/g,' '); }
function pasteExampleFill(text){ S.recoveryText = text; render(); }
function renderPassportRecoveryPaste(){
  return `${topbar(true,true)}
  <div class="stage screen">
    ${splitCols(`

    `, `
    <div class="inline-explain-actions" style="margin:0 0 16px;">
      ${PASTE_MATCH_EXAMPLES.map(e=>`<button class="btn btn-secondary" onclick="pasteExampleFill('${e.text.replace(/'/g,"\\'")}')" style="text-transform:capitalize;">"${e.text}"</button>`).join('')}
    </div>
    <textarea class="field-input" placeholder="e.g. Police verification report has been received" oninput="S.recoveryText=this.value">${S.recoveryText||''}</textarea>
    <button class="btn btn-primary btn-block" onclick="pasteMatch()">Continue <span class="btn-arrow">${ICONS.arrow}</span></button>
    `)}

}
function pasteMatch(){
  const t = normalizePasted(S.recoveryText);
  const match = PASTE_MATCH_EXAMPLES.find(e=>e.text===t);
  setAns('recoveryPastedText', S.recoveryText||'');
  if(!match){ nav('passport-diagnosis'); return; } // no exact match → stays 'not_sure' → UNCLASSIFIED
  if(match.outOfScope){ setAns('guardrail','yes'); nav('passport-outofscope'); return; }
  setAns('q1', match.q1);
  nav('passport-q2');
}

function renderPassportDiagnosis(){

function PASSPORT_STEPS_FOR(d){
  if(d.state==='6') return null;
  const idx = {'1':2,'2':2,'4':2,'3':3}[d.state] ?? null;
  if(idx===null) return null;
  return {steps:['Application','Appointment','Police verification','Processing'], current:idx};
}

function togglePrepStep(i){
  S.prepChecks[i]=!S.prepChecks[i];

  // updates the snapshot rather than letting the Home card drift.
  const c = activeCase();
  if(c && c.outcome==='still_open' && c.engineKey===S.screen.split('-')[0]){
    Object.assign(c, caseSnapshot(c.engineKey, c.serviceLabel, S.screen));

// [Bracketed] blanks are real sub-tasks ("find your ARN"), so they get
// counted and surfaced, live — never left as invisible work the user
// discovers after sending.
function bracketCount(t){ return ((t||'').match(/\[[^\]]*\]/g)||[]).length; }
// Confirmed facts fill their matching brackets — but a filled value is
// exactly the value most worth checking, so fills stay visible (the
// list below the draft) and the draft never reads "ready" until the
// user has looked at them.
function fillDraft(base){
  let text = base; const fills=[];
  for(const f of (S.caseFacts||[])){
    if(f.fills && text.includes(f.fills)){
      text = text.split(f.fills).join(f.value);
      fills.push({label:f.label, value:f.value});
    }
  }
  return {text, fills};
}
function bracketHintText(t){
  const n = bracketCount(t);
  const fills = (S.prepFills||[]).length;
  if(n>0) return `${n} blank${n>1?'s':''} in [brackets] left to fill; everything else is ready.`;
  if(fills>0 && !S.fillsReviewed) return 'All blanks filled. Check the details filled from your text below.';
  return 'All blanks filled. Ready to copy and send.';
}
function updateBracketHint(v){
  const el = document.getElementById('bracket-hint');
  if(el) el.textContent = bracketHintText(v);
}
function copyDraft(){
  const ta = document.getElementById('prep-draft');
  if(!ta) return;
  // The copy always succeeds — remaining blanks are named, not policed.
  S.copiedBrackets = bracketCount(ta.value);
  const flash = ()=>{ S.copied=true; render(); setTimeout(()=>{ S.copied=false; render(); }, 2200); };
  try{ navigator.clipboard.writeText(ta.value).then(flash, ()=>{ ta.select(); }); }
  catch(e){ ta.select(); }
}

    `, `
    ${freshBanner(engineKey)}
    ${channel}
    ${prep.draft ? (()=>{ const fd = fillDraft(prep.draft); S.prepFills = fd.fills; return `<div class="prep-card">
      <div class="nm-k" style="margin-bottom:10px;">Your draft</div>
      <textarea id="prep-draft" class="prep-draft" oninput="S.prepDraft=this.value; updateBracketHint(this.value)" aria-label="Editable draft">${S.prepDraft ?? fd.text}</textarea>
      <div class="prep-card-foot">
        <div class="prep-hint" id="bracket-hint">${bracketHintText(S.prepDraft ?? fd.text)}</div>
        <button class="copy-btn ${S.copied ? (S.copiedBrackets>0?'copied-warn':'copied') : ''}" onclick="copyDraft()">${S.copied ? (S.copiedBrackets>0 ? `Copied, ${S.copiedBrackets} blank${S.copiedBrackets>1?'s':''} left` : 'Copied ✓') : 'Copy draft'}</button>
      </div>
      ${fd.fills.length ? `<div class="fill-list">
        <span class="fk">Filled from your text; please check them</span>
        ${fd.fills.map(f=>`${f.label}: <b>${f.value}</b>`).join(' · ')}
        <button class="fill-review" onclick="S.fillsReviewed=!S.fillsReviewed; render();" aria-pressed="${!!S.fillsReviewed}">
          <span class="pstep-box" style="${S.fillsReviewed?'background:var(--butter); border-color:var(--ink);':''}">${S.fillsReviewed?ICONS.stepCheck:''}</span>
          I've checked these details

      </div>` : ''}
    </div>`;})() : ''}
    <div class="psteps-count">${done} of ${prep.steps.length} done</div>
    <div class="psteps">
      ${prep.steps.map((s,i)=>{
        const step = typeof s === 'string' ? {text:s} : s;
        return `<div class="pstep ${S.prepChecks[i]?'done':''}">
