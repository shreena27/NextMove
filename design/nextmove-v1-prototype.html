    </div>
    <button class="btn btn-primary btn-block" style="margin-top:0;" onclick="authVerifyOtp()">Verify and save my case <span class="btn-arrow">${ICONS.arrow}</span></button>
    <button class="auth-switch" onclick="authResend()">${S.otpResent ? 'Code sent again ✓' : "Didn't get it? Send again"}</button>
    <div class="demo-hint">Design prototype: any 6 digits work here.</div>
    `)}
  </div>`;
}
// Optional, skippable ask-once after phone/email verification — the one
// place a name is ever requested. Skipping falls back to the masked id
// and never blocks the save (spec: 2026-09-05-account-chip-profile-
// popover-design.md).
function renderSaveName(){
  const midSave = !!S.pendingSave; // false when entered via the popover's "Add your name"
  return `${topbar(false,false)}
  <div class="stage screen">
    <div class="narrow">
      ${crumbs(midSave ? ['Save your case','One last thing, optional'] : ['Your name (optional)'], 'sq-butter')}
      <h2 class="headline">What should we call you?</h2>
      <p class="lede">Just a first name is fine; it's how your casefile greets you when you come back. ${midSave ? 'Skip it and nothing changes about your case.' : 'It changes nothing about your cases.'}</p>
      <div class="auth-field">
        <div class="auth-label">Your name</div>
        <input class="auth-input" type="text" placeholder="First name" value="${S.pendingName||''}" oninput="S.pendingName=this.value" onkeydown="if(event.key==='Enter')saveNameFinish(true)">
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:0;" onclick="saveNameFinish(true)">${midSave ? 'Save my case' : 'Save name'} <span class="btn-arrow">${ICONS.arrow}</span></button>
      <button class="auth-switch" onclick="saveNameFinish(false)">${midSave ? 'Skip and save without a name' : 'Never mind'}</button>
    </div>
  </div>`;
}
function renderSaveDone(){
  const p = S.pendingSave;
  return `${topbar(false,false)}
  <div class="stage screen">
    <div class="narrow">
      ${crumbs(['Case saved'], 'sq-butter')}
      <h2 class="headline">Your casefile is saved.</h2>
      <p class="lede">It's waiting on the Home screen whenever you come back: your answers, your diagnosis, and any steps you've already ticked off. Nothing else happens with your ${S.user && S.user.method==='phone' ? 'number' : 'account'}.</p>
      ${p ? `<button class="btn btn-primary btn-block" onclick="nav('${p.returnScreen}')">Back to my case <span class="btn-arrow">${ICONS.arrow}</span></button>` : ''}
      <button class="btn btn-secondary btn-block" onclick="restart()">Go to Home</button>
    </div>
  </div>`;
}

/* ================= ROUTER ================= */
function render(){
  const el = document.getElementById('app');
  // Entrance animations only on a genuine screen change; a same-screen
  // re-render (trust toggle, selection, inline explainer) keeps the page
  // still instead of replaying the choreography.
  el.classList.toggle('settled', S.renderedScreen === S.screen);
  S.renderedScreen = S.screen;
  let html;
  switch(S.screen){
    case 'home': html = renderHome(); break;
    case 'passport-guardrail': html = renderPassportGuardrail(); break;
    case 'passport-outofscope': html = renderPassportOutOfScope(); break;
    case 'passport-q1': html = renderPassportQ1(); break;
    case 'passport-recovery': html = renderPassportRecovery(); break;
    case 'passport-recovery-paste': html = renderPassportRecoveryPaste(); break;
    case 'passport-recovery-show': html = renderPassportRecoveryShow(); break;
    case 'passport-q2': html = renderPassportQ2(); break;
    case 'passport-diagnosis': html = renderPassportDiagnosis(); break;
    case 'passport-nextmove': html = renderNextMove('Passport','passport'); break;
    case 'passport-prepare': html = renderPrepare('Passport','passport'); break;
    case 'voter-entry': html = renderVoterEntry(); break;
    case 'voter-q1': html = renderVoterQ1(); break;
    case 'voter-q2': html = renderVoterQ2(); break;
    case 'voter-diagnosis': html = renderVoterDiagnosis(); break;
    case 'voter-nextmove': html = renderNextMove('Voter Services','voter'); break;
    case 'voter-prepare': html = renderPrepare('Voter Services','voter'); break;
    case 'sir-state': html = renderSirState(); break;
    case 'sir-unsupported': html = renderSirUnsupported(); break;
    case 'sir-reverifying': html = renderSirReverifying(); break;
    case 'sir-q1': html = renderSirQ1(); break;
    case 'sir-diagnosis': html = renderSirDiagnosis(); break;
    case 'sir-nextmove': html = renderNextMove('SIR','sir'); break;
    case 'sir-prepare': html = renderPrepare('SIR','sir'); break;
    case 'interp-confirm': html = renderInterpConfirm(); break;
    case 'save-case': html = renderSaveCase(); break;
    case 'save-otp': html = renderSaveOtp(); break;
    case 'save-name': html = renderSaveName(); break;
    case 'save-done': html = renderSaveDone(); break;
    case 'checkin': html = renderCheckin(); break;
    case 'dead-end': html = renderDeadEnd(); break;
    case 'case-closed': html = renderCaseClosed(); break;
    default: html = renderHome();
  }
  el.innerHTML = html + `<div class="protofooter">Design prototype, not the build. Static reference for review only. Every recommendation above traces to an official source cited in "Why am I seeing this?" or the Voter/SIR Verification Matrix; anything without one is marked UNVERIFIED in the source docs and never hard-coded as a rule. Sign-in and saving are simulated: Google sign-in is instant, any 6-digit code is accepted, and your casefile lives only in this browser. Sources last human-verified ${SOURCES_VERIFIED}.<br><button class="read-change" onclick="toggleFreshDemo()">${FRESHNESS.demo ? '✕ Exit source-change preview — sources are actually verified and current' : 'Preview: what users see when an official source changes'}</button></div>`;
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.acctOpen){ S.acctOpen=false; S.signOutConfirm=false; render(); }
});
render();
</script>
