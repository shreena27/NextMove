name: Source freshness check

# Daily check that the official government PDFs NextMove's playbook rules
# cite haven't changed since sources/manifest.json's committed hash.
# Writes sources/freshness.json and commits it only when the content
# actually changed, so the normal build+deploy picks it up — the deployed
# app reads freshness.json at build time, never fetches it live.
#
# NEXTMOVE_CI=1 makes check_freshness.py skip 'local'-mode documents
# (ceodelhi.gov.in blocks GitHub's runner IPs — see manifest.json's
# FAQ_SIR2026.pdf.check_note); those get checked by a human running the
# same script locally instead, and this workflow carries their last-known
# status forward untouched.
on:
  schedule:
    # 21:17 UTC ~= 02:47 IST, off-peak. An off-:00 minute avoids GitHub's
    # documented delay/drop risk for crowded cron slots.
    - cron: '17 21 * * *'
  workflow_dispatch: {}
  # TEMPORARY, for testing this workflow before it merges — remove before
  # opening the PR. workflow_dispatch only fires from the default branch's
  # copy of this file; this isn't being merged just to test it.
  push:
    branches: [c6-freshness]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run check_freshness.py
        id: check
        working-directory: sources
        env:
          NEXTMOVE_CI: '1'
        run: |
          set +e
          python check_freshness.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit freshness.json if it changed
        id: commit
        run: |
          # Stage first, then diff --cached: a plain `git diff` never
          # flags a brand-new untracked file as changed, which would
          # silently skip committing the very first freshness.json ever
          # written.
          git add sources/freshness.json
          if git diff --cached --quiet -- sources/freshness.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sources/freshness.json unchanged, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update sources/freshness.json (automated)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Best-effort: only runs if VERCEL_TOKEN is configured as a repo
      # secret. The Vercel GitHub App isn't installed on this repo yet
      # (auto-deploy-on-push isn't wired up at all, for any commit, not
      # just this workflow's), so until either that app is installed or
      # this secret is added, a freshness.json change still needs a
      # manual `vercel --prod --scope <team>` redeploy to go live — this
      # step is dead weight until then, not a hard requirement to satisfy
      # right now.
      #
      # The `secrets` context cannot be referenced in a step's `if:` at
      # all (confirmed empirically 2026-09-07 — GitHub rejects the entire
      # workflow file at parse time, silently, with no useful error
      # beyond "workflow file issue"; wrapping in ${{ }} doesn't help
      # either). The fix is the standard one: check the secret inside a
      # `run:` step (secrets ARE accessible there) and gate the next step
      # on that step's OUTPUT instead.
      - name: Check for Vercel deploy secret
        id: has-vercel-token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' && steps.has-vercel-token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Fail the job if any source needs attention
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "::error::check_freshness.py exited ${{ steps.check.outputs.exit_code }} - a source changed or was unreachable this run. See the 'Run check_freshness.py' step's log above for which one."
          exit 1
